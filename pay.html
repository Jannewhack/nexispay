<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pay securely · NexisPay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F2F4FA;--card:#fff;--ink:#15173D;--mute:#6B6F93;--line:#E3E6F2;--acc:#5B3FF5;--acc2:#8A74FF;--ok:#0FA47A;--warn:#D98A0B;--hero1:#2A1FA8;--hero2:#5B3FF5;--r:22px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1024;--card:#171A3A;--ink:#EEF0FF;--mute:#9A9EC7;--line:#262A52;--acc:#8A74FF;--acc2:#B0A2FF;--ok:#35D6A5;--warn:#F2B24A;--hero1:#3A2BD0;--hero2:#6C52FF}}
:root[data-theme="dark"]{--bg:#0E1024;--card:#171A3A;--ink:#EEF0FF;--mute:#9A9EC7;--line:#262A52;--acc:#8A74FF;--acc2:#B0A2FF;--ok:#35D6A5;--warn:#F2B24A;--hero1:#3A2BD0;--hero2:#6C52FF}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;position:relative}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{flex:1;overflow-y:auto;padding:18px 18px 100px}
section{display:none}section.on{display:block;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){section.on{animation:none}}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--hero1),var(--acc2));position:relative}
.logo:after{content:"";position:absolute;inset:8px;border:3px solid #fff;border-radius:4px;border-right-color:transparent}
.icon-btn{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px;cursor:pointer}
h2{font-size:24px;letter-spacing:-.5px;margin-bottom:4px}
.sub{color:var(--mute);font-size:14px;margin-bottom:16px}
.hero{background:linear-gradient(150deg,var(--hero1),var(--hero2));color:#fff;border-radius:28px;padding:22px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:26px solid rgba(255,255,255,.1)}
.hero small{opacity:.8;font-size:13px}
.bal{font-size:38px;font-weight:800;letter-spacing:-1px;margin:6px 0 2px}
.seg{display:inline-flex;background:rgba(255,255,255,.18);border-radius:12px;padding:3px;margin-top:10px}
.seg button{border:0;background:none;color:#fff;font:700 12px inherit;font-family:inherit;padding:7px 14px;border-radius:9px;cursor:pointer}
.seg button.on{background:#fff;color:var(--hero1)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.act{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 6px;text-align:center;font:700 13px inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.act span{display:block;font-size:22px;margin-bottom:4px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.av{width:42px;height:42px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-weight:800;color:var(--acc)}
.row b{display:block;font-size:15px}.row em{font-style:normal;color:var(--mute);font-size:12px}
.amt{margin-left:auto;text-align:right;font-weight:800}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px;margin-top:3px}
.paid{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pend{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.head{display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px;font-weight:800}
.head a{color:var(--acc);font-size:13px;font-weight:700;cursor:pointer}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pad button{height:54px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 20px inherit;font-family:inherit;cursor:pointer}
.pad button:active{background:var(--bg)}
.due{text-align:center;margin:8px 0}
.due b{font-size:44px;letter-spacing:-1px}
.cta{width:100%;height:54px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--hero1),var(--acc));color:#fff;font:800 16px inherit;font-family:inherit;cursor:pointer}
.qrbox{background:#fff;border-radius:26px;padding:18px;text-align:center;border:1px solid var(--line)}
.qrbox svg{width:100%;max-width:260px;height:auto}
.qrhead{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;color:#15173D;margin-bottom:2px}
.qrhead .logo{width:24px;height:24px;border-radius:8px}
.qrhead .logo:after{inset:6px}
.qrscan{color:#6B6F93;font-size:13px;margin-bottom:10px}
.qrinr{font-size:30px;font-weight:800;color:#15173D;letter-spacing:-.5px;margin-top:6px}
.qrbox p{color:#555;font-size:13px;margin-top:8px}
.ghost{width:100%;height:48px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 14px inherit;font-family:inherit;margin-top:10px;cursor:pointer}
.sw{margin-left:auto;width:46px;height:28px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;border:0;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on:after{left:21px}
.seg2{display:flex;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:14px}
.seg2 button{flex:1;border:0;background:none;color:var(--mute);font:700 14px inherit;font-family:inherit;padding:10px 0;border-radius:12px;cursor:pointer}
.seg2 button.on{background:var(--acc);color:#fff}
.in{width:100%;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 16px inherit;font-family:inherit;padding:0 14px;margin-bottom:12px}
.lbl{font-size:13px;font-weight:700;color:var(--mute);margin:2px 0 6px;display:block}
.chips{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.chips button{flex:1;min-width:64px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 14px inherit;font-family:inherit;cursor:pointer}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.big{font-size:34px;font-weight:800;text-align:center;height:68px}
.linkcard{background:var(--card);border:1px dashed var(--acc);border-radius:20px;padding:14px;margin-top:6px;word-break:break-all;font-weight:700;color:var(--acc)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:16px}
.mode{display:flex;background:var(--bg);border-radius:14px;padding:3px;margin-bottom:12px}
.mode button{flex:1;border:0;background:none;color:var(--mute);font:700 13px inherit;font-family:inherit;padding:10px 0;border-radius:11px;cursor:pointer}
.mode button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 4px rgba(21,23,61,.12)}
.ck{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:0 14px 34px rgba(21,23,61,.08)}
.mer{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mer .av{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--hero1),var(--acc2));color:#fff;font-size:20px}
.ver{color:var(--ok);font-size:12px;font-weight:700;margin-top:2px}
.ttl{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.amtw{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:18px;padding:0 14px;height:68px;background:var(--bg);margin:6px 0 12px}
.amtw:focus-within{border-color:var(--acc)}
.amtw span{font-size:28px;font-weight:800;color:var(--mute);margin-right:6px}
.amtw input{border:0;background:none;color:var(--ink);font:800 30px inherit;font-family:inherit;width:100%;outline:0;height:100%}
.sum{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px;font-size:14px}
.sum div{display:flex;justify-content:space-between;padding:4px 0;color:var(--mute)}.sum b{color:var(--ink)}
.trust{display:flex;justify-content:center;gap:14px;color:var(--mute);font-size:12px;margin:14px 0;flex-wrap:wrap}
.okc{width:76px;height:76px;border-radius:50%;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);display:grid;place-items:center;font-size:38px;margin:18px auto 12px}
.share{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.share a,.share button{height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 13px inherit;font-family:inherit;display:grid;place-items:center;text-decoration:none;cursor:pointer}
select.in{appearance:none}
nav{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:26px;display:flex;padding:6px;box-shadow:0 10px 30px rgba(21,23,61,.14)}
nav button{flex:1;border:0;background:none;color:var(--mute);font:700 11px inherit;font-family:inherit;padding:8px 0;border-radius:20px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:#fff;background:var(--acc)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-120px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;transition:.3s;z-index:9}
.toast.show{transform:translate(-50%,0)}
button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
</style>
</head>
<body>
<div class="app"><main style="padding-bottom:30px">
<div class="top"><div class="brand"><div class="logo"></div>NexisPay</div><small class="sub" style="margin:0">🔒 Secure checkout</small></div>
<div id="bad" hidden><div class="ck" style="text-align:center"><div class="okc" style="background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)">!</div><h2>Link not available</h2><p class="sub">This payment link is invalid or has expired. Please ask the shop for a new one.</p></div></div>
<div id="page" hidden>
 <div class="ck">
  <div class="mer"><div class="av" id="pav">S</div><div><b id="pbrand"></b><div class="ver">✓ Verified merchant</div></div></div>
  <div class="ttl" id="ptitle"></div><p class="sub" id="pnote" style="margin:0 0 6px"></p>
  <span class="lbl" style="margin-top:12px">Amount</span>
  <div class="amtw"><span>₹</span><input id="pamt" inputmode="decimal" placeholder="0" aria-label="Amount in rupees"></div>
  <div class="chips" id="pchips"><button data-v="100">₹100</button><button data-v="500">₹500</button><button data-v="1000">₹1,000</button><button data-v="2000">₹2,000</button></div>
  <p class="sub" id="phint" style="font-size:13px;margin:0 0 6px"></p>
  <div class="sum"><div>Amount<b id="s1">₹0</b></div><div>Method<b>UPI</b></div><div id="sexp" hidden>Link<b id="s4"></b></div></div>
 </div>
 <button class="cta" id="ppay" style="margin-top:16px">Pay with UPI</button>
 <div class="trust"><span>🔒 Encrypted</span><span>⚡ Instant confirmation</span><span>Powered by NexisPay</span></div>
</div>
<div class="toast" id="toast"></div></main></div>
<script>
const SB=supabase.createClient("https://fvhqaxhnnqvftirhkbim.supabase.co","sb_publishable_hoNP6P-I-tTjT4XNVnS8cQ_VQQFn_R0");
const GATEWAY=null; /* later: URL of the server function that creates the UPI order */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const f=n=>Number(n).toLocaleString("en");
const slug=new URLSearchParams(location.search).get("c")||"";
let L=null;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3200)}
function upd(){const a=parseFloat($("#pamt").value)||0,min=Number(L.min_amount_inr),fixed=L.fixed_amount_inr!=null;
 $("#s1").textContent="₹"+f(a);$("#ppay").textContent=a?"Pay ₹"+f(a)+" with UPI":"Pay with UPI";
 $("#phint").textContent=fixed?"Fixed amount set by the shop":(a&&a<min?"Minimum amount is ₹"+f(min):"Pay any amount from ₹"+f(min)+" to ₹1,00,000")}
async function boot(){if(!slug)return $("#bad").hidden=false;
 const r=await SB.rpc("get_link",{p_slug:slug});if(r.error||!r.data||!r.data.length)return $("#bad").hidden=false;
 L=r.data[0];$("#pbrand").textContent=L.brand;$("#pav").textContent=(L.brand[0]||"S").toUpperCase();$("#ptitle").textContent=L.title;$("#pnote").textContent=L.note||"";
 const fixed=L.fixed_amount_inr!=null;$("#pamt").value=fixed?L.fixed_amount_inr:"";$("#pamt").readOnly=fixed;$("#pchips").hidden=fixed;
 if(L.expires_at){$("#sexp").hidden=false;$("#s4").textContent="Until "+new Date(L.expires_at).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
 upd();$("#page").hidden=false}
$("#pamt").oninput=upd;
$$("#pchips button").forEach(b=>b.onclick=()=>{$("#pamt").value=b.dataset.v;upd()});
$("#ppay").onclick=async()=>{const a=parseFloat($("#pamt").value)||0;
 if(!a||a<Number(L.min_amount_inr)||a>100000)return toast(a>100000?"Maximum amount is ₹1,00,000":"Minimum amount is ₹"+f(L.min_amount_inr));
 if(!GATEWAY)return toast("Online payments are not enabled yet. Please try again later.");
 const r=await fetch(GATEWAY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug,amount:a})});
 const d=await r.json().catch(()=>({}));if(!r.ok||!d.url)return toast("Could not start the payment. Please try again.");location.href=d.url};
boot();
</script>
</body>
</html>
